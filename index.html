<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>진도표 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
            background-color: #f0f7ff;
            color: #1e293b;
            word-break: keep-all;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        .timetable-inner-box {
            margin: 2px;
            height: calc(100% - 4px);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .is-selected {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        
        .has-master-data {
            background-color: #dbeafe !important;
            color: #1e40af !important;
        }

        .is-modified-cell {
            background-color: #fee2e2 !important;
            color: #991b1b !important;
        }

        /* 4-5교시 구분선 */
        .lunch-divider {
            border-top: 2px solid #94a3b8 !important;
        }

        .compact-table td, .compact-table th {
            padding: 6px !important;
        }
        
        @media (max-width: 640px) {
            .timetable-inner-box textarea { padding-top: 10px; }
            .day-label { font-size: 13px !important; }
            .date-label { font-size: 11px !important; }
            .period-label { font-size: 11px !important; width: 35px !important; }
        }

        /* popup */
        #cell-popup-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(15,23,42,0.45); z-index: 60;
            align-items: center; justify-content: center;
        }
        #cell-popup-overlay.open { display: flex; }
        #cell-popup {
            background: #fff; border-radius: 20px;
            width: min(92vw, 360px);
            box-shadow: 0 8px 40px rgba(0,0,0,0.18); overflow: hidden;
        }
        #cell-popup-header {
            padding: 14px 18px 10px; border-bottom: 1px solid #e2e8f0;
            font-size: 13px; font-weight: 800; color: #334155;
        }
        #cell-popup-body { padding: 14px 18px; }
        #cell-popup-textarea {
            width: 100%; min-height: 90px; border: 1.5px solid #bfdbfe;
            border-radius: 10px; padding: 10px 12px;
            font-size: 14px; font-weight: 700; color: #1e293b;
            resize: vertical; outline: none; font-family: inherit;
            background: #f0f7ff; box-sizing: border-box;
        }
        #cell-popup-textarea:focus { border-color: #3b82f6; background: #fff; }
        #cell-popup-footer { display: flex; gap: 8px; padding: 0 18px 16px; }
        .popup-btn {
            flex: 1; padding: 10px 0; border-radius: 10px;
            font-size: 13px; font-weight: 800; border: none;
            cursor: pointer; transition: opacity 0.15s;
        }
        .popup-btn:active { opacity: 0.7; }
        .popup-btn-cancel { background: #f1f5f9; color: #64748b; }
        .popup-btn-delete { background: #fee2e2; color: #b91c1c; }
        .popup-btn-save   { background: #2563eb; color: #fff; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-white border-b border-blue-100 shadow-sm sticky top-0 z-30">
        <div class="max-w-[1400px] mx-auto px-4 py-3 md:px-6">
            <div class="flex items-center justify-between gap-2">

                <!-- 타이틀 -->
                <h1 class="text-lg font-bold text-slate-900 flex items-center gap-1.5 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                    <span>진도표</span>
                </h1>

                <!-- 날짜 네비게이터 -->
                <div class="flex items-center bg-blue-50 rounded-xl p-1 border border-blue-100 flex-1 min-w-0">
                    <button onclick="changeWeek(-7)" class="p-1.5 hover:bg-white rounded-lg transition-all active:scale-90 shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>
                    <span id="current-week-display" class="flex-1 text-xs font-bold text-slate-700 text-center truncate px-1"></span>
                    <button onclick="changeWeek(7)" class="p-1.5 hover:bg-white rounded-lg transition-all active:scale-90 shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                </div>

                <!-- 수정 모드 토글 -->
                <button id="edit-mode-btn" onclick="toggleEditMode()" class="flex items-center gap-1.5 shrink-0" title="수정 모드">
                    <span id="edit-mode-label" class="text-[11px] font-bold text-slate-400 whitespace-nowrap">수정</span>
                    <div id="edit-toggle-track" class="relative w-10 h-5 rounded-full bg-slate-200 transition-colors duration-200">
                        <div id="edit-toggle-thumb" class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition-all duration-200"></div>
                    </div>
                </button>

                <!-- 설정 메뉴 -->
                <button onclick="toggleSettings()" class="p-2 hover:bg-blue-50 rounded-xl transition-all shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-[1400px] mx-auto p-4 md:p-6 space-y-6">
        <section class="bg-white rounded-3xl border border-blue-100 overflow-hidden shadow-sm">
            <div class="w-full">
                <div id="timetable-grid" class="grid gap-0 w-full" style="display: grid; grid-template-columns: 35px repeat(5, 1fr);">
                </div>
            </div>
            <div class="px-4 py-1.5 bg-slate-50 border-t flex justify-end">
                <span id="save-indicator" class="text-[10px] font-bold text-blue-500 opacity-0 transition-opacity">저장됨</span>
            </div>
        </section>

        <div id="sections-container" class="space-y-8"></div>

        <div class="flex justify-center pt-4">
            <button onclick="addNewSection()" class="flex items-center gap-2 px-6 py-3 bg-slate-900 text-white rounded-2xl hover:bg-black transition-all shadow-lg active:scale-95 font-bold text-sm">
                <i data-lucide="plus" class="w-4 h-4"></i> 새 진도 테이블 추가
            </button>
        </div>
    </main>

    <div id="settings-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden" onclick="toggleSettings()"></div>
    <div id="settings-sidebar" class="fixed top-0 right-0 h-full w-full max-w-lg bg-white z-50 shadow-2xl transform translate-x-full transition-transform duration-300 ease-out overflow-y-auto p-6">
        <div class="flex justify-between items-center mb-8 pb-4 border-b">
            <h2 class="text-xl font-bold">설정</h2>
            <button onclick="toggleSettings()" class="p-2 hover:bg-slate-100 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="space-y-8">
            <section>
                <label class="block text-sm font-bold text-slate-700 mb-3">학급 명단 (쉼표 구분)</label>
                <input type="text" id="class-list-input" class="w-full px-4 py-3 bg-blue-50 border border-blue-100 rounded-xl outline-none font-bold">
            </section>
            <section>
                <div class="flex items-center justify-between mb-3">
                    <label class="text-sm font-bold text-slate-700">마스터 시간표 (기본값)</label>
                    <!-- 없는 교시 설정 슬라이더 토글 버튼 -->
                    <button id="noclass-mode-btn" onclick="toggleNoClassMode()" class="flex items-center gap-1.5 shrink-0" title="없는 교시 설정">
                        <span id="noclass-mode-label" class="text-[11px] font-bold text-slate-400 whitespace-nowrap">없는 교시 설정</span>
                        <div id="noclass-toggle-track" class="relative w-10 h-5 rounded-full bg-slate-200 transition-colors duration-200">
                            <div id="noclass-toggle-thumb" class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition-all duration-200"></div>
                        </div>
                    </button>
                </div>
                <div class="border border-blue-100 rounded-xl overflow-hidden">
                    <div id="master-timetable-grid" class="bg-white text-[10px]" style="display:grid; grid-template-columns: 28px repeat(5, 1fr);"></div>
                </div>
                <p id="noclass-hint" class="hidden mt-2 text-[11px] text-slate-400 text-center">셀을 눌러 수업 없는 교시를 표시하세요</p>
            </section>
            <button onclick="saveGlobalSettings()" class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold">저장 및 즉시 적용</button>
        </div>
    </div>

    <!-- cell edit popup -->
    <div id="cell-popup-overlay" onclick="closeCellPopup(event)">
        <div id="cell-popup">
            <div id="cell-popup-header">셀 편집</div>
            <div id="cell-popup-body">
                <textarea id="cell-popup-textarea" placeholder="내용 입력..."></textarea>
            </div>
            <div id="cell-popup-footer">
                <button class="popup-btn popup-btn-cancel" onclick="closeCellPopup()">취소</button>
                <button class="popup-btn popup-btn-delete" onclick="deleteSlotContent()">삭제</button>
                <button class="popup-btn popup-btn-save" onclick="saveSlotContent()">저장</button>
            </div>
        </div>
    </div>

    <script>
        let popupSlot = { row: null, col: null };

        function handleCellClick(r, c) {
            if (state.editMode) return;
            if (state.masterNoClass[r][c]) return;
            if (state.selectedSlot.row === r && state.selectedSlot.col === c) {
                openCellPopup(r, c);
            } else {
                state.selectedSlot = { row: r, col: c };
                renderTimetable();
            }
        }

        function openCellPopup(r, c) {
            popupSlot = { row: r, col: c };
            const weekKey = getWeekKey(state.currentDate);
            const displayTable = state.weeklyData[weekKey] ? state.weeklyData[weekKey].timetable : state.masterTimetable;
            document.getElementById('cell-popup-header').textContent = DAYS[c] + '요일 ' + (r + 1) + '교시';
            document.getElementById('cell-popup-textarea').value = displayTable[r][c] || '';
            document.getElementById('cell-popup-overlay').classList.add('open');
            setTimeout(() => document.getElementById('cell-popup-textarea').focus(), 80);
        }

        function closeCellPopup(e) {
            if (e && e.target !== document.getElementById('cell-popup-overlay')) return;
            document.getElementById('cell-popup-overlay').classList.remove('open');
            popupSlot = { row: null, col: null };
        }

        function saveSlotContent() {
            if (popupSlot.row === null) return;
            const val = document.getElementById('cell-popup-textarea').value;
            const weekKey = getWeekKey(state.currentDate);
            if (!state.weeklyData[weekKey]) state.weeklyData[weekKey] = { timetable: JSON.parse(JSON.stringify(state.masterTimetable)), modified: {} };
            if (!state.weeklyData[weekKey].modified) state.weeklyData[weekKey].modified = {};
            state.weeklyData[weekKey].timetable[popupSlot.row][popupSlot.col] = val;
            state.weeklyData[weekKey].modified[popupSlot.row + '-' + popupSlot.col] = true;
            saveToLocal();
            document.getElementById('cell-popup-overlay').classList.remove('open');
            popupSlot = { row: null, col: null };
            renderTimetable();
        }

        function deleteSlotContent() {
            if (popupSlot.row === null) return;
            const weekKey = getWeekKey(state.currentDate);
            const masterVal = state.masterTimetable[popupSlot.row][popupSlot.col];
            if (!state.weeklyData[weekKey]) state.weeklyData[weekKey] = { timetable: JSON.parse(JSON.stringify(state.masterTimetable)), modified: {} };
            if (!state.weeklyData[weekKey].modified) state.weeklyData[weekKey].modified = {};
            state.weeklyData[weekKey].timetable[popupSlot.row][popupSlot.col] = masterVal;
            delete state.weeklyData[weekKey].modified[popupSlot.row + '-' + popupSlot.col];
            saveToLocal();
            document.getElementById('cell-popup-overlay').classList.remove('open');
            popupSlot = { row: null, col: null };
            renderTimetable();
        }

        let state = {
            classes: ['1-1', '1-2', '1-3'],
            currentDate: new Date(),
            masterTimetable: Array(7).fill().map(() => Array(5).fill('')),
            masterNoClass: Array(7).fill().map(() => Array(5).fill(false)),
            weeklyData: {}, 
            selectedSlot: { row: null, col: null },
            editMode: false,
            sections: [
                { title: '차시별 진도', showHiddenMode: false, rows: [{ title: '', isHidden: false, progress: {} }], theme: 'blue' }
            ]
        };

        const DAYS = ['월', '화', '수', '목', '금'];

        function init() {
            const saved = localStorage.getItem('progress_tracker_final');
            if (saved) {
                const parsed = JSON.parse(saved);
                state.classes = parsed.classes || state.classes;
                state.masterTimetable = parsed.masterTimetable || state.masterTimetable;
                state.masterNoClass = parsed.masterNoClass || Array(7).fill().map(() => Array(5).fill(false));
                state.weeklyData = parsed.weeklyData || state.weeklyData;
                state.sections = (parsed.sections && parsed.sections.length > 0) ? parsed.sections : state.sections;
            }
            renderAll();
        }

        function saveToLocal() { localStorage.setItem('progress_tracker_final', JSON.stringify(state)); }

        function getMonday(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            const mon = new Date(d.setDate(diff));
            mon.setHours(0,0,0,0);
            return mon;
        }

        function getWeekKey(date) { return getMonday(date).toISOString().split('T')[0]; }

        function changeWeek(days) { state.currentDate.setDate(state.currentDate.getDate() + days); state.selectedSlot = {row:null, col:null}; renderAll(); }

        function safeIcons() {
            if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
        }

        function renderAll() {
            updateDateDisplay();
            renderTimetable();
            renderSections();
            safeIcons();
        }

        function updateDateDisplay() {
            const mon = getMonday(state.currentDate);
            const month = mon.getMonth() + 1;
            const weekNum = Math.ceil(mon.getDate() / 7);
            document.getElementById('current-week-display').innerText = `${month}월 ${weekNum}주차`;
        }

        function renderTimetable() {
            const grid = document.getElementById('timetable-grid');
            const weekKey = getWeekKey(state.currentDate);
            const isWeeklyModified = !!state.weeklyData[weekKey];
            const displayTable = isWeeklyModified ? state.weeklyData[weekKey].timetable : state.masterTimetable;
            const mon = getMonday(state.currentDate);

            let html = `<div class="h-12 flex items-center justify-center text-[10px] font-bold text-slate-400 bg-slate-50 border-b border-r period-label">교시</div>`;
            
            DAYS.forEach((day, i) => {
                const d = new Date(mon);
                d.setDate(mon.getDate() + i);
                html += `
                    <div class="h-12 flex flex-col items-center justify-center border-b border-r bg-slate-50">
                        <span class="text-[11px] font-black text-blue-500 leading-none date-label">${d.getMonth()+1}.${d.getDate()}</span>
                        <span class="text-[13px] font-extrabold text-slate-600 day-label">${day}</span>
                    </div>`;
            });

            for (let i = 0; i < 7; i++) {
                const lunchLine = i === 4 ? 'lunch-divider' : '';
                html += `<div class="h-14 flex items-center justify-center text-[11px] font-bold text-slate-400 border-r border-b period-label ${lunchLine}">${i+1}</div>`;
                for (let j = 0; j < 5; j++) {
                    const content = displayTable[i][j];
                    const hasContent = content && content.trim() !== '';
                    const isSelected = state.selectedSlot.row === i && state.selectedSlot.col === j;
                    const modifiedMap = state.weeklyData[weekKey]?.modified || {};
                    const isModified = !!modifiedMap[`${i}-${j}`];
                    const isNoClass = state.masterNoClass[i][j];
                    const cellColor = isNoClass ? '' : (isModified ? "is-modified-cell" : (hasContent ? "has-master-data" : ""));
                    const slotBg = isNoClass ? 'bg-slate-300' : '';

                    html += `
                        <div class="h-14 border-r border-b relative timetable-slot ${lunchLine} ${slotBg}" onclick="handleCellClick(${i}, ${j})">
                            <div class="timetable-inner-box ${cellColor} ${isSelected ? 'is-selected' : ''}">
                                ${isNoClass ? '' :
                                  state.editMode ? 
                                    `<textarea oninput="updateSlot(${i}, ${j}, this.value)" class="w-full h-full bg-transparent text-sm font-bold text-center resize-none outline-none leading-tight px-0.5 flex items-center">${content || ''}</textarea>` :
                                    `<span class="text-sm font-bold text-center px-0.5 whitespace-pre-wrap break-all leading-tight">${content || ''}</span>`
                                }
                            </div>
                        </div>`;
                }
            }
            grid.innerHTML = html;
        }

        function updateSlot(r, c, val) {
            const weekKey = getWeekKey(state.currentDate);
            if (!state.weeklyData[weekKey]) state.weeklyData[weekKey] = { timetable: JSON.parse(JSON.stringify(state.masterTimetable)) };
            state.weeklyData[weekKey].timetable[r][c] = val;
            if (!state.weeklyData[weekKey].modified) state.weeklyData[weekKey].modified = {};
            state.weeklyData[weekKey].modified[`${r}-${c}`] = true;
            saveToLocal();
        }

        function toggleEditMode() {
            state.editMode = !state.editMode;
            const label = document.getElementById('edit-mode-label');
            const track = document.getElementById('edit-toggle-track');
            const thumb = document.getElementById('edit-toggle-thumb');
            if (state.editMode) {
                label.innerText = '완료';
                label.classList.replace('text-slate-400', 'text-blue-600');
                track.classList.replace('bg-slate-200', 'bg-blue-500');
                thumb.classList.replace('left-0.5', 'left-[22px]');
            } else {
                label.innerText = '수정';
                label.classList.replace('text-blue-600', 'text-slate-400');
                track.classList.replace('bg-blue-500', 'bg-slate-200');
                thumb.classList.replace('left-[22px]', 'left-0.5');
            }
            state.selectedSlot = {row:null, col:null};
            renderTimetable();
        }

        function getClassColWidth() {
            return state.classes.length >= 5 ? 'width:72px; min-width:72px;' : '';
        }
        function getTableWidthClass() {
            return state.classes.length >= 5 ? '' : 'w-full';
        }

        function renderSections() {
            const container = document.getElementById('sections-container');
            if (state.sections.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-slate-400 font-medium italic">테이블을 추가해주세요.</div>`;
                return;
            }

            const colWidthStyle = getClassColWidth();
            const tableWidthClass = getTableWidthClass();

            container.innerHTML = state.sections.map((section, sIdx) => {
                const isBase = sIdx === 0;
                const themeColor = section.theme === 'red' ? 'rose' : 'blue';
                const headerBg = isBase ? 'bg-blue-100' : 'bg-rose-100';

                return `
                <div class="bg-white rounded-2xl border border-${themeColor}-100 overflow-hidden shadow-sm">
                    <div class="px-4 py-1.5 border-b flex flex-wrap justify-between items-center ${headerBg} gap-2">
                        <input type="text" value="${section.title}" onchange="state.sections[${sIdx}].title=this.value; saveToLocal();"
                               class="text-[13px] font-bold bg-transparent outline-none border-b-2 border-transparent focus:border-blue-400 transition-all text-slate-800">
                        
                        <div class="flex items-center gap-2">
                            ${!isBase ? `<button onclick="removeSection(${sIdx})" class="p-1.5 text-slate-300 hover:text-red-500 transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                        </div>
                    </div>

                    <div class="overflow-x-auto scrollbar-hide">
                        <table class="compact-table ${tableWidthClass} border-collapse">
                            <thead>
                                <tr class="bg-slate-50/50 border-b border-slate-100">
                                    <th class="w-[18%] min-w-[90px] text-left px-4 py-3 text-[11px] font-bold text-slate-400 uppercase sticky left-0 bg-white z-10">차시</th>
                                    ${state.classes.map(c => `<th style="${colWidthStyle}" class="text-center px-1 py-3 text-sm font-extrabold text-slate-700 border-l border-slate-100/50">${c}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
                                ${section.rows.map((row, rIdx) => renderTableRow(sIdx, rIdx, row, colWidthStyle)).join('')}
                            </tbody>
                        </table>
                    </div>
                    <div class="p-2 bg-slate-50/30 border-t border-slate-100">
                        <button onclick="addRow(${sIdx})" class="flex items-center gap-1 text-[10px] font-bold text-${themeColor}-600 hover:text-${themeColor}-800 transition-all">
                            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 행 추가
                        </button>
                    </div>
                </div>
            `}).join('');
            safeIcons();
        }

        function renderTableRow(sIdx, rIdx, row, colWidthStyle) {
            colWidthStyle = colWidthStyle || getClassColWidth();
            const svgCheck = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
            const svgTrash = `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>`;

            return `<tr class="border-b-2 border-slate-200">
                <td class="px-4 py-2 sticky left-0 bg-white z-10">
                    <div class="flex flex-col gap-1">
                        <textarea oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'; state.sections[${sIdx}].rows[${rIdx}].title=this.value; saveToLocal();" 
                                  class="w-full bg-transparent outline-none font-bold text-slate-700 text-sm resize-none overflow-hidden" 
                                  placeholder="차시명 입력...">${row.title}</textarea>
                        <button onclick="removeRow(${sIdx}, ${rIdx})" class="w-fit p-1 text-slate-400 hover:text-red-500 transition-colors" title="이 차시 삭제">
                            ${svgTrash}
                        </button>
                    </div>
                </td>
                ${state.classes.map(cls => {
                    const p = row.progress[cls] || {done:false, memo:''};
                    return `<td style="${colWidthStyle}" class="text-center p-1">
                        <div class="flex flex-col items-center gap-1.5 p-1.5 rounded-xl border-2 ${p.done ? 'border-emerald-400' : 'border-slate-100'}">
                            <button onclick="toggleProgress(${sIdx}, ${rIdx}, '${cls}')" class="w-full h-7 rounded-lg flex items-center justify-center transition-all ${p.done ? 'bg-emerald-500 text-white' : 'bg-white border border-slate-200 text-slate-300 hover:border-blue-500'}">
                                ${svgCheck}
                            </button>
                            <textarea onchange="updateMemo(${sIdx}, ${rIdx}, '${cls}', this.value)" class="w-full h-10 text-[10px] font-bold bg-slate-50 rounded-lg p-1.5 outline-none resize-none" placeholder="메모...">${p.memo || ''}</textarea>
                        </div>
                    </td>`;
                }).join('')}
            </tr>`;
        }

        function toggleProgress(sIdx, rIdx, className) {
            const row = state.sections[sIdx].rows[rIdx];
            if (!row.progress[className]) row.progress[className] = { done: false, memo: '' };
            row.progress[className].done = !row.progress[className].done;

            if (sIdx === 0 && state.selectedSlot.row !== null) {
                const weekKey = getWeekKey(state.currentDate);
                if (!state.weeklyData[weekKey]) state.weeklyData[weekKey] = { timetable: JSON.parse(JSON.stringify(state.masterTimetable)), modified: {} };
                if (!state.weeklyData[weekKey].modified) state.weeklyData[weekKey].modified = {};
                const r = state.selectedSlot.row, c = state.selectedSlot.col;
                const cellVal = state.weeklyData[weekKey].timetable[r][c];
                const addVal = row.title || '수업';

                if (row.progress[className].done) {
                    if (!cellVal || !cellVal.includes(addVal)) {
                        state.weeklyData[weekKey].timetable[r][c] = cellVal ? `${cellVal}\n${addVal}` : addVal;
                        const indicator = document.getElementById('save-indicator');
                        indicator.innerText = "시간표 자동 기록됨";
                        indicator.style.opacity = '1';
                        setTimeout(() => { indicator.style.opacity = '0'; indicator.innerText = "저장됨"; }, 2000);
                    }
                } else {
                    if (cellVal && cellVal.includes(addVal)) {
                        const newVal = cellVal.split('\n').filter(line => line.trim() !== addVal.trim()).join('\n');
                        state.weeklyData[weekKey].timetable[r][c] = newVal;
                    }
                }
            }
            saveToLocal(); renderAll();
        }

        function toggleSettings() {
            const sb = document.getElementById('settings-sidebar');
            const ov = document.getElementById('settings-overlay');
            const open = sb.classList.contains('translate-x-full');
            if(open) { 
                sb.classList.remove('translate-x-full'); ov.classList.remove('hidden'); 
                document.getElementById('class-list-input').value = state.classes.join(', ');
                renderMasterTimetable();
            } else { sb.classList.add('translate-x-full'); ov.classList.add('hidden'); }
            safeIcons();
        }

        let noClassMode = false;

        function toggleNoClassMode() {
            noClassMode = !noClassMode;
            const label = document.getElementById('noclass-mode-label');
            const track = document.getElementById('noclass-toggle-track');
            const thumb = document.getElementById('noclass-toggle-thumb');
            const hint = document.getElementById('noclass-hint');
            
            if (noClassMode) {
                label.classList.replace('text-slate-400', 'text-slate-900');
                track.classList.replace('bg-slate-200', 'bg-slate-800');
                thumb.classList.replace('left-0.5', 'left-[22px]');
                hint.classList.remove('hidden');
            } else {
                label.classList.replace('text-slate-900', 'text-slate-400');
                track.classList.replace('bg-slate-800', 'bg-slate-200');
                thumb.classList.replace('left-[22px]', 'left-0.5');
                hint.classList.add('hidden');
            }
            renderMasterTimetable();
        }

        function clickMasterCell(i, j) {
            if (!noClassMode) return;
            state.masterNoClass[i][j] = !state.masterNoClass[i][j];
            renderMasterTimetable();
        }

        function renderMasterTimetable() {
            const grid = document.getElementById('master-timetable-grid');
            let html = `<div class="bg-blue-50 p-1 border-b border-r"></div>`;
            DAYS.forEach(d => html += `<div class="bg-blue-50 p-1 text-center border-b border-r text-blue-600 font-bold text-sm">${d}</div>`);
            for (let i = 0; i < 7; i++) {
                const lunchLine = i === 4 ? 'lunch-divider' : '';
                const rowBg = 'bg-slate-50';
                html += `<div class="${rowBg} p-1 text-center border-b border-r text-slate-500 font-bold text-sm ${lunchLine}">${i+1}</div>`;
                for (let j = 0; j < 5; j++) {
                    const isNoClass = state.masterNoClass[i][j];
                    const noBg = isNoClass ? 'bg-slate-300' : '';
                    const ptrStyle = noClassMode ? 'style="pointer-events:none"' : '';
                    html += `<div class="border-b border-r p-0 h-11 ${noBg} cursor-pointer flex items-center justify-center ${lunchLine}" onclick="clickMasterCell(${i},${j})">
                        ${isNoClass
                            ? ``
                            : `<textarea id="m-t-${i}-${j}" rows="1" class="w-full h-auto text-lg text-center resize-none outline-none bg-transparent font-bold p-0 m-0 leading-tight" ${ptrStyle}>${state.masterTimetable[i][j] || ''}</textarea>`
                        }
                    </div>`;
                }
            }
            grid.innerHTML = html;
        }

        function saveGlobalSettings() {
            state.classes = document.getElementById('class-list-input').value.split(',').map(s => s.trim()).filter(s => s !== '');
            for (let i = 0; i < 7; i++) for (let j = 0; j < 5; j++) {
                const ta = document.getElementById(`m-t-${i}-${j}`);
                if (ta) state.masterTimetable[i][j] = ta.value;
            }
            
            // 저장 시 슬라이더 상태 초기화
            if (noClassMode) {
                noClassMode = false;
                const label = document.getElementById('noclass-mode-label');
                const track = document.getElementById('noclass-toggle-track');
                const thumb = document.getElementById('noclass-toggle-thumb');
                const hint = document.getElementById('noclass-hint');
                label.classList.replace('text-slate-900', 'text-slate-400');
                track.classList.replace('bg-slate-800', 'bg-slate-200');
                thumb.classList.replace('left-[22px]', 'left-0.5');
                hint.classList.add('hidden');
            }

            for (const key in state.weeklyData) {
                const wd = state.weeklyData[key];
                const modified = wd.modified || {};
                const newTable = JSON.parse(JSON.stringify(state.masterTimetable));
                for (const pos in modified) {
                    const [r, c] = pos.split('-').map(Number);
                    newTable[r][c] = wd.timetable[r][c];
                }
                wd.timetable = newTable;
            }
            saveToLocal();
            document.getElementById('settings-sidebar').classList.add('translate-x-full');
            document.getElementById('settings-overlay').classList.add('hidden');
            renderAll();
        }

        function addRow(sIdx) { state.sections[sIdx].rows.push({ title: '', isHidden: false, progress: {} }); saveToLocal(); renderSections(); }
        function removeRow(sIdx, rIdx) { state.sections[sIdx].rows.splice(rIdx, 1); saveToLocal(); renderSections(); }
        function addNewSection() { state.sections.push({ id: Date.now(), title: '이벤트', showHiddenMode: false, rows: [{ title: '', isHidden: false, progress: {} }], theme: 'red' }); saveToLocal(); renderSections(); }
        function removeSection(sIdx) { if(sIdx > 0 && confirm("테이블을 삭제할까요?")) { state.sections.splice(sIdx, 1); saveToLocal(); renderSections(); } }
        function toggleRowHidden(sIdx, rIdx) { state.sections[sIdx].rows[rIdx].isHidden = !state.sections[sIdx].rows[rIdx].isHidden; saveToLocal(); renderSections(); }
        function toggleShowHiddenMode(sIdx) { state.sections[sIdx].showHiddenMode = !state.sections[sIdx].showHiddenMode; renderSections(); }
        function updateMemo(sIdx, rIdx, cls, val) { 
            if(!state.sections[sIdx].rows[rIdx].progress[cls]) state.sections[sIdx].rows[rIdx].progress[cls] = {done:false, memo:''};
            state.sections[sIdx].rows[rIdx].progress[cls].memo = val; 
            saveToLocal(); 
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
